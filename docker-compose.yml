name: farmared

services:
  mongo:
    image: mongo:7.0
    container_name: farmared-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-farmared}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - farmared

  mongo-init: # inicia el replica set
    image: mongo:7.0
    container_name: farmared-mongo-init
    restart: "no"
    depends_on:
      - mongo
    volumes:
      - ./docker/mongo-init:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/init-entrypoint.sh"]
    networks:
      - farmared

  neo4j:
    image: neo4j:5.26-community
    container_name: farmared-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-development_password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - farmared

  outbox-worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: farmared-outbox-worker
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: ${MONGO_DB:-farmared}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-development_password}
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    networks:
      - farmared

  neo4j-test:
    image: neo4j:5.26-community
    container_name: farmared-neo4j-test
    profiles: ["test"]
    restart: "no"
    ports:
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/test_password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-test-data:/data
      - neo4j-test-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - farmared

networks:
  farmared:
    name: farmared

volumes:
  mongo-data:
    name: farmared-mongo-data
  neo4j-data:
    name: farmared-neo4j-data
  neo4j-logs:
    name: farmared-neo4j-logs
  neo4j-test-data:
    name: farmared-neo4j-test-data
  neo4j-test-logs:
    name: farmared-neo4j-test-logs
